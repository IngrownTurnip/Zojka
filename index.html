<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <!-- Google Fonts for classic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --wine: #1a0814;
      --plum: #2a1830;
      --cream: #fbf7ee;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--plum);
    }

    body {
      overflow-x: hidden;
    }

    .comic {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------- Fixed Bat Overlay ---------- */
    .bats {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .bat {
      position: absolute;
      top: var(--y);
      left: 0;
      width: var(--w, 54px);
      animation: fly var(--d) linear var(--delay) infinite;
      pointer-events: auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .bat.rev { animation-name: fly-rev; }
    .bat.rev svg { transform: scaleX(-1); }

    @keyframes fly {
      from { transform: translate3d(-20vw, 0, 0); }
      to   { transform: translate3d(120vw, 0, 0); }
    }

    @keyframes fly-rev {
      from { transform: translate3d(120vw, 0, 0); }
      to   { transform: translate3d(-20vw, 0, 0); }
    }

    .bob { animation: bob var(--bobd, 3.4s) ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .bat svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      transition: transform 0.2s ease;
    }

    .bat.squeaked svg {
      transform: scale(1.3) rotate(15deg);
      filter: drop-shadow(0 0 8px var(--gold));
    }

    .bat.rev.squeaked svg {
      transform: scale(-1.3, 1.3) rotate(-15deg);
    }

    .bat-confetti-particle {
      position: fixed;
      width: 6px;
      height: 8px;
      background: var(--c, var(--gold));
      border-radius: 1px;
      pointer-events: none;
      z-index: 999;
      animation: bat-explode 0.6s ease-out forwards;
    }

    @keyframes bat-explode {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg); opacity: 0; }
    }

    .bat .body {
      fill: #140713;
      stroke: rgba(212, 175, 55, 0.6);
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .bat .wing {
      transform-box: fill-box;
      animation: flap var(--f, 0.7s) ease-in-out infinite alternate;
    }
    .bat .wing-l { transform-origin: 100% 40%; }
    .bat .wing-r { transform-origin: 0% 40%; }

    @keyframes flap {
      from { transform: scaleY(1); }
      to   { transform: scaleY(0.4); }
    }

    /* ---------- Fixed Card: Vintage Elegance ---------- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(env(safe-area-inset-top) + 2dvh) 10px 0;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 10;
    }

    .card {
      width: min(100%, 520px);
      box-sizing: border-box;
      padding: 22px 20px 20px;
      border-radius: 16px;
      background: rgba(26, 8, 20, 0.82);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(212, 175, 55, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fade-in 1.4s ease-out 0.3s both;
      pointer-events: auto;
    }

    /* Serif Title */
    .greeting {
      margin: 2px 0 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2.2rem, 9.5vw, 3.2rem);
      line-height: 1.1;
      text-align: center;
      color: var(--gold-light);
      letter-spacing: 0.03em;
      animation: enter-greeting 2s ease-out both;
    }

    .greeting span {
      display: inline-block;
      animation: float 9s ease-in-out infinite, glow 6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes enter-greeting {
      from { opacity: 0; transform: translateY(-40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9),
                     0 0 12px rgba(212, 175, 55, 0.3);
      }
      50% {
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9),
                     0 0 22px rgba(243, 229, 171, 0.65);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .more {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Wax Seal Style Summary Button */
    .more summary {
      align-self: center;
      list-style: none;
      cursor: pointer;
      padding: 8px 24px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(114, 47, 55, 0.45));
      color: var(--gold-light);
      font: 700 0.85rem/1.4 "Montserrat", system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.3s ease;
    }

    .more summary::-webkit-details-marker { display: none; }
    .more[open] .when-closed { display: none; }
    .more:not([open]) .when-open { display: none; }

    .more:not([open]) summary {
      animation: invite 4s ease-in-out infinite;
    }

    .more[open] summary {
      padding: 4px 16px;
      font-size: 0.72rem;
      border-color: rgba(212, 175, 55, 0.4);
    }

    @keyframes invite {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
      50%      { box-shadow: 0 0 16px 2px rgba(212, 175, 55, 0.45); }
    }

    .player {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 30vh;
      max-height: 30dvh;
      background: #000;
      border-radius: 8px;
      border: 1px solid var(--gold);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
      pointer-events: auto;
      animation: fade-in 1.6s ease-out both;
    }

    /* Vintage Invitation Ticket */
    .ticket {
      display: flex;
      align-items: stretch;
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      overflow: hidden;
      background: var(--cream);
      color: #2c1622;
      text-decoration: none;
      border: 1px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      font-family: "Montserrat", system-ui, sans-serif;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      animation: fade-in 2.4s ease-out 0.4s both;
    }

    .ticket:active { transform: scale(0.98); }

    .t-main {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .t-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8c2a4e;
    }

    .place {
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.2;
      color: #1a0814;
    }

    .dates { font-size: 0.78rem; opacity: 0.85; }

    .t-count {
      min-width: 82px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-left: 2px dashed rgba(140, 42, 78, 0.25);
      background: linear-gradient(160deg, #f3e5ab, #d4af37);
      color: #1a0814;
    }

    .t-count b { font-size: 1.6rem; line-height: 1.1; }
    .t-count small { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

    @media (min-width: 600px) {
      .overlay { padding-top: calc(env(safe-area-inset-top) + 3dvh); }
      .card { padding: 24px; gap: 16px; }
      .greeting { font-size: clamp(3.2rem, 6.5vw, 4.2rem); }
      .player { max-height: 38dvh; }
      .bat { width: calc(var(--w, 54px) * 1.3); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bats { display: none; }
      .card, .greeting, .greeting span, .player, .ticket,
      .more:not([open]) summary { animation: none; }
    }
  </style>
</head>
<body>

    <div class="bat" style="--y:50%; --w:64px; --d:30s; --delay:-24s; --f:0.8s;"><div class="bob" style="--bobd:3.8s"><svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg></div></div>
    <div class="bat rev" style="--y:60%; --w:52px; --d:25s; --delay:-15s; --f:0.7s;"><div class="bob" style="--bobd:3.3s"><svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg></div></div>

    <div class="bat rev" style="--y:92%; --w:44px; --d:23s; --delay:-20s; --f:0.62s;"><div class="bob" style="--bobd:2.8s"><svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg></div></div>

  <div class="overlay">
    <main class="card">
      <h1 class="greeting"><span>Happy Birthday,<br>Szczureczka!</span></h1>

      <details class="more">
        <summary>
          <span class="when-closed">✦ Open Invitation ✦</span>
          <span class="when-open">Close ▲</span>
        </summary>

        <video class="player" src="video.mp4#t=0.1" controls playsinline preload="metadata"></video>

        <a class="ticket" href="https://winosabat.pl/pokoje-goscinne/" target="_blank" rel="noopener noreferrer">
          <span class="t-main">
            <span class="t-label">Your getaway</span>
            <span class="place">Winnica i Winiarnia Celtica</span>
            <span class="dates">Mon 16 – Wed 18 November 2026</span>
          </span>
          <span class="t-count">
            <b id="days">🍷</b>
            <small id="unit">soon</small>
          </span>
        </a>
      </details>
    </main>
  </div>

  <script>
    /* Countdown */
    (function () {
      try {
        var start = new Date(2026, 10, 16);
        var end = new Date(2026, 10, 19);
        var now = new Date();
        var d = document.getElementById("days");
        var u = document.getElementById("unit");
        if (now < start) {
          var n = Math.ceil((start - now) / 86400000);
          d.textContent = n;
          u.textContent = n === 1 ? "day to go" : "days to go";
        } else if (now < end) {
          d.textContent = "🍷";
          u.textContent = "enjoy!";
        } else {
          d.textContent = "💖";
          u.textContent = "memories";
        }
      } catch (e) {}
    })();

    /* Bat sound & confetti */
    (function () {
      let audioCtx = null;

      function playSqueak() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          osc.type = 'sine';
          var now = audioCtx.currentTime;
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(2600, now + 0.12);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      }

      function createExplosion(x, y) {
        var colors = ['#d4af37', '#f3e5ab', '#ffffff', '#722f37'];
        var particleCount = 10;
        for (var i = 0; i < particleCount; i++) {
          var p = document.createElement('div');
          p.className = 'bat-confetti-particle';
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);

          var angle = Math.random() * Math.PI * 2;
          var distance = 45 + Math.random() * 65;
          var tx = Math.cos(angle) * distance;
          var ty = Math.sin(angle) * distance;
          p.style.setProperty('--tx', tx + 'px');
          p.style.setProperty('--ty', ty + 'px');

          document.body.appendChild(p);
          setTimeout(function(particle) { particle.remove(); }, 600, p);
        }
      }

      var bats = document.querySelectorAll('.bat');
      bats.forEach(function (bat) {
        bat.addEventListener('click', function (e) {
          playSqueak();
          var rect = bat.getBoundingClientRect();
          createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);

          bat.classList.add('squeaked');
          setTimeout(function () { bat.classList.remove('squeaked'); }, 300);
        });
      });
    })();
  </script>
