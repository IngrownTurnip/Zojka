<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    :root {
      --pink: #ff69b4;
      --plum: #2a1830;
      --cream: #fff3d1;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--plum); /* shown only while the image loads */
    }

    body {
      overflow-x: hidden;
    }

    /* Comic: normal in-flow image, shown once, full width, scrolls with the page.
       Its height IS the page height. */
    .comic {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------- Decorations: fixed, never block touches or add scroll height ---------- */
    .bats {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    /* ---------- Bats ---------- */
    .bat {
      position: absolute;
      top: var(--y);
      left: 0;
      width: var(--w, 54px);
      animation: fly var(--d) linear var(--delay) infinite;
      pointer-events: auto; /* allow clicking/tapping bats */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .bat.rev {
      animation-name: fly-rev;
    }

    .bat.rev svg {
      transform: scaleX(-1); /* face the other way */
    }

    @keyframes fly {
      from { transform: translate3d(-20vw, 0, 0); }
      to   { transform: translate3d(120vw, 0, 0); }
    }

    @keyframes fly-rev {
      from { transform: translate3d(120vw, 0, 0); }
      to   { transform: translate3d(-20vw, 0, 0); }
    }

    .bob {
      animation: bob var(--bobd, 3.4s) ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .bat svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      transition: transform 0.2s ease;
    }

    /* Squeak / tap animation effect */
    .bat.squeaked svg {
      transform: scale(1.3) rotate(15deg);
      filter: drop-shadow(0 0 8px var(--pink));
    }

    .bat.rev.squeaked svg {
      transform: scale(-1.3, 1.3) rotate(-15deg);
    }

    /* Confetti explosion particle styling */
    .bat-confetti-particle {
      position: fixed;
      width: 6px;
      height: 10px;
      background: var(--c, #ff69b4);
      border-radius: 2px;
      pointer-events: none;
      z-index: 999;
      animation: bat-explode 0.6s ease-out forwards;
    }

    @keyframes bat-explode {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(360deg);
        opacity: 0;
      }
    }

    .bat .body {
      fill: #1a0b20;
      stroke: rgba(255, 105, 180, 0.55);
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .bat .wing {
      transform-box: fill-box;
      animation: flap var(--f, 0.7s) ease-in-out infinite alternate;
    }

    .bat .wing-l { transform-origin: 100% 40%; }
    .bat .wing-r { transform-origin: 0% 40%; }

    @keyframes flap {
      from { transform: scaleY(1); }
      to   { transform: scaleY(0.4); }
    }

    /* ---------- Fixed card with greeting, video and ticket ---------- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;   /* fallback */
      height: 100dvh;  /* mobile Safari 15.4+ / modern browsers */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(env(safe-area-inset-top) + 2dvh) 10px 0;
      box-sizing: border-box;
      pointer-events: none; /* scrolling passes through */
      z-index: 10;
    }

    .card {
      width: min(100%, 520px);
      box-sizing: border-box;
      padding: 14px 12px 14px;
      border-radius: 22px;
      background: rgba(42, 24, 48, 0.68);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 180, 0.5);
      box-shadow: 0 12px 40px rgba(20, 0, 30, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px; /* space between greeting and the panel below */
      animation: fade-in 1.4s ease-out 0.3s both;
      pointer-events: auto;
    }

    /* Outer h1 = one-time entrance; inner span = endless float + glow */
    .greeting {
      margin: 4px 0 0;
      font-family: "Snell Roundhand", "Brush Script MT", "Lucida Handwriting",
                   Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2rem, 9.5vw, 3rem);
      line-height: 1.15;
      text-align: center;
      color: var(--pink);
      letter-spacing: 0.02em;
      animation: enter-greeting 2s ease-out both;
    }

    .greeting span {
      display: inline-block;
      animation: float 9s ease-in-out infinite, glow 6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes enter-greeting {
      from { opacity: 0; transform: translateY(-40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 0 2px 4px rgba(20, 0, 20, 0.8),
                     0 0 10px rgba(255, 105, 180, 0.35),
                     0 0 22px rgba(255, 105, 180, 0.2);
      }
      50% {
        text-shadow: 0 2px 4px rgba(20, 0, 20, 0.8),
                     0 0 14px rgba(255, 170, 215, 0.85),
                     0 0 34px rgba(255, 105, 180, 0.6);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Hide / show panel (no JavaScript needed) */
    .more {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px; /* space between video and ticket */
    }

    .more summary {
      align-self: center;
      list-style: none;
      cursor: pointer;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: var(--cream);
      font: 600 0.95rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .more summary::-webkit-details-marker { display: none; }
    .more[open] .when-closed { display: none; }
    .more:not([open]) .when-open { display: none; }

    /* While closed: slow, gentle glow on the button to invite a tap */
    .more:not([open]) summary {
      animation: invite 4s ease-in-out infinite;
    }

    /* When open: smaller, quieter button */
    .more[open] summary {
      padding: 4px 14px;
      font-size: 0.75rem;
    }

    @keyframes invite {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0); }
      50%      { box-shadow: 0 0 16px 3px rgba(255, 105, 180, 0.55); }
    }

    .player {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 30vh;
      max-height: 30dvh;
      background: #000;
      border-radius: 12px;
      border: 2px solid var(--pink);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      pointer-events: auto; /* controls stay usable */
      animation: fade-in 1.6s ease-out both;
    }

    /* Ticket-style link: place + dates on the left, countdown on the right */
    .ticket {
      display: flex;
      align-items: stretch;
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      overflow: hidden;
      background: var(--cream);
      color: #4a0d35;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      animation: fade-in 2.4s ease-out 0.4s both;
    }

    .ticket:active { transform: scale(0.98); }

    .t-main {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .t-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d63384;
    }

    .place { font-weight: 700; font-size: 1rem; line-height: 1.25; }
    .dates { font-size: 0.82rem; opacity: 0.85; }

    .t-count {
      min-width: 78px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-left: 2px dashed rgba(90, 18, 64, 0.35);
      background: linear-gradient(160deg, #ff9ccf, var(--pink));
      color: #4a0d35;
    }

    .t-count b { font-size: 1.7rem; line-height: 1.1; }
    .t-count small { font-size: 0.7rem; font-weight: 600; }

    /* ---------- Larger screens (tablet and up) ---------- */
    @media (min-width: 600px) {
      .overlay { padding-top: calc(env(safe-area-inset-top) + 3dvh); }
      .card { padding: 18px 20px 20px; gap: 14px; }
      .greeting { font-size: clamp(3rem, 6vw, 4rem); }
      .player { max-height: 38dvh; }
      .bat { width: calc(var(--w, 54px) * 1.3); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bats { display: none; }
      .card, .greeting, .greeting span, .player, .ticket,
      .more:not([open]) summary { animation: none; }
    }
  </style>
</head>

  <div class="overlay">
    <main class="card">

          </span>

            <small id="unit">soon</small>
          </span>
        </a>

  <script>
    /* Countdown to Monday 16 November 2026 */
    (function () {
      try {
        var start = new Date(2026, 10, 16);
        var end = new Date(2026, 10, 19);
        var now = new Date();
        var d = document.getElementById("days");
        var u = document.getElementById("unit");
        if (now < start) {
          var n = Math.ceil((start - now) / 86400000);
          d.textContent = n;
          u.textContent = n === 1 ? "day to go" : "days to go";
        } else if (now < end) {
          d.textContent = "🎉";
          u.textContent = "enjoy!";
        } else {
          d.textContent = "💖";
          u.textContent = "memories";
        }
      } catch (e) {}
    })();

    /* Interactive bat squeaker & confetti explosion */
    (function () {
      let audioCtx = null;

      function playSqueak() {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();

          osc.type = 'sine';
          var now = audioCtx.currentTime;
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(2600, now + 0.12);

          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(now);
          osc.stop(now + 0.15);
        } catch (e) {}
      }

      function createExplosion(x, y) {
        var colors = ['#ff69b4', '#ffd27a', '#fff3d1', '#b388ff', '#7fe0d0'];
        var particleCount = 10;
        for (var i = 0; i < particleCount; i++) {
          var p = document.createElement('div');
          p.className = 'bat-confetti-particle';
          p.style.left = x + 'px';
          p.style.top = y + 'px';
          p.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);

          var angle = Math.random() * Math.PI * 2;
          var distance = 45 + Math.random() * 65;
          var tx = Math.cos(angle) * distance;
          var ty = Math.sin(angle) * distance;
          p.style.setProperty('--tx', tx + 'px');
          p.style.setProperty('--ty', ty + 'px');

          document.body.appendChild(p);
          setTimeout(function(particle) {
            particle.remove();
          }, 600, p);
        }
      }

      var bats = document.querySelectorAll('.bat');
      bats.forEach(function (bat) {
        bat.addEventListener('click', function (e) {
          playSqueak();
          
          // Get the center coordinates of the bat
          var rect = bat.getBoundingClientRect();
          var centerX = rect.left + rect.width / 2;
          var centerY = rect.top + rect.height / 2;
          
          createExplosion(centerX, centerY);

          bat.classList.add('squeaked');
          setTimeout(function () {
            bat.classList.remove('squeaked');
          }, 300);
        });
      });
    })();
  </script>
