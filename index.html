<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
        }

        .background img {
            display: block;
            width: 100%;
            height: auto;
        }

        .birthday-message {
            position: fixed;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            text-align: center;
            z-index: 10;
            color: white;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: bold;
            text-shadow:
                3px 3px 0 #ff1493,
                -2px -2px 0 #ff1493,
                0 0 20px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .video-container {
            position: fixed;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            z-index: 5;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            .birthday-message {
                top: 10%;
            }

            .video-container {
                top: 32%;
                width: 94%;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <img src="comic.jpg" alt="">
    </div>

    <div class="birthday-message">
        Happy Birthday!
    </div>

    <div class="video-container">
        <video controls playsinline preload="metadata">
            <source src="video.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

</body>
</html>
