<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    /* ---------- Mobile-first base styles ---------- */
    html, body {
      margin: 0;
      padding: 0;
      background: #2a1830; /* shown only while the image loads */
    }

    body {
      overflow-x: hidden;
    }

    /* In-flow image: shown once, natural aspect ratio, full screen width.
       It scrolls with the page, and its height IS the page height. */
    .comic {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Fixed overlay: stays put while the page scrolls and adds no scroll height. */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;   /* fallback */
      height: 100dvh;  /* mobile Safari 15.4+ / modern browsers */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* content sits at the top */
      gap: 10px;
      padding: calc(env(safe-area-inset-top) + 2dvh) 12px 0;
      box-sizing: border-box;
      pointer-events: none; /* scrolling passes through empty areas */
      z-index: 10;
    }

    /* Outer h1 plays the one-time entrance; inner span does the endless float + glow.
       They are separate elements so the two transform animations never conflict. */
    .greeting {
      margin: 0;
      font-family: "Snell Roundhand", "Brush Script MT", "Lucida Handwriting",
                   Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2.2rem, 11vw, 3.5rem);
      line-height: 1.1;
      text-align: center;
      color: #ff69b4;
      letter-spacing: 0.02em;
      animation: enter-greeting 2s ease-out both;
    }

    .greeting span {
      display: inline-block;
      animation:
        float 9s ease-in-out infinite,
        glow 6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes enter-greeting {
      from { opacity: 0; transform: translateY(-40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    @keyframes glow {
      0%, 100% {
        text-shadow:
          0 2px 4px rgba(50, 0, 40, 0.75),
          0 0 10px rgba(255, 140, 200, 0.35),
          0 0 22px rgba(255, 140, 200, 0.2);
      }
      50% {
        text-shadow:
          0 2px 4px rgba(50, 0, 40, 0.75),
          0 0 14px rgba(255, 190, 220, 0.8),
          0 0 34px rgba(255, 200, 90, 0.55);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .player {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 36vh;   /* fallback */
      max-height: 36dvh;
      background: #000;
      border-radius: 10px;
      border: 2px solid #fff3d1;
      box-shadow: 0 6px 24px rgba(40, 0, 40, 0.55);
      pointer-events: auto; /* video controls stay usable */
      animation: fade-in 3.5s ease-out 1s both; /* appears just after the greeting */
    }

    /* Place button: name on top, dates underneath. Easy to tap on a phone. */
    .book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      max-width: 100%;
      box-sizing: border-box;
      padding: 10px 22px;
      border-radius: 22px;
      background: #fff3d1;
      color: #ff69b4;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 16px rgba(40, 0, 40, 0.5);
      pointer-events: auto; /* the button must be tappable */
      animation: fade-in 4.5s ease-out 1.6s both;
    }

    .book .place {
      font-weight: 700;
      font-size: 1rem;
    }

    .book .dates {
      font-weight: 500;
      font-size: 0.85rem;
      opacity: 0.85;
    }

    .book:active {
      transform: scale(0.97);
    }

    /* ---------- Larger screens (tablet and up) ---------- */
    @media (min-width: 600px) {
      .overlay {
        gap: 16px;
        padding-left: 16px;
        padding-right: 16px;
        padding-top: calc(env(safe-area-inset-top) + 3dvh);
      }
      <br>
      .greeting {
        font-size: clamp(3rem, 7vw, 4.5rem);
      }
      <br>
      <br>
      .player {
        max-width: min(92vw, 640px);
        max-height: 46dvh;
        border-width: 3px;
        border-radius: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .greeting, .greeting span, .player, .book { animation: none; }
    }
  </style>
</head>
<body>

  <img class="comic" src="comic.jpg" alt="Birthday comic">
<br>
  <br>
  <div class="overlay">
    <br>
    <h1 class="greeting"><span>Happy Birthday, Szczureczka!</span></h1>
    <br>
    <br>
    <video class="player" src="video.mp4#t=0.1" controls playsinline preload="metadata"></video>
    <a class="book" href="https://winosabat.pl/pokoje-goscinne/" target="_blank" rel="noopener noreferrer">
      <br>
      <br>
      <br>
      <span class="place">Winnica i Winiarnia Celtica</span>
      <span class="dates">Mon 16 – Wed 18 November 2026</span>
    </a>
  </div>

</body>
</html>
