<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <style>
    :root {
      --pink: #ff69b4;
      --plum: #2a1830;
      --cream: #fff3d1;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--plum); /* shown only while the image loads */
    }

    body {
      overflow-x: hidden;
    }

    /* Comic: normal in-flow image, shown once, full width, scrolls with the page.
       Its height IS the page height. */
    .comic {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------- Decorations: fixed, never block touches or add scroll height ---------- */
    .confetti, .bats {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      pointer-events: none;
      z-index: 5;
    }

    .confetti i {
      position: absolute;
      top: 0;
      left: var(--x);
      width: var(--s, 8px);
      height: calc(var(--s, 8px) * 1.6);
      background: var(--c);
      border-radius: 2px;
      opacity: 0;
      animation: fall var(--d) linear var(--delay) infinite;
    }

    @keyframes fall {
      0%   { transform: translate3d(0, -6vh, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.85; }
      92%  { opacity: 0.85; }
      100% { transform: translate3d(var(--drift, 30px), 108vh, 0) rotate(540deg); opacity: 0; }
    }

    /* ---------- Bats ---------- */
    .bat {
      position: absolute;
      top: var(--y);
      left: 0;
      width: var(--w, 54px);
      animation: fly var(--d) linear var(--delay) infinite;
    }

    .bat.rev {
      animation-name: fly-rev;
    }

    .bat.rev svg {
      transform: scaleX(-1); /* face the other way */
    }

    @keyframes fly {
      from { transform: translate3d(-20vw, 0, 0); }
      to   { transform: translate3d(120vw, 0, 0); }
    }

    @keyframes fly-rev {
      from { transform: translate3d(120vw, 0, 0); }
      to   { transform: translate3d(-20vw, 0, 0); }
    }

    .bob {
      animation: bob var(--bobd, 3.4s) ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    .bat svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .bat .body {
      fill: #1a0b20;
      stroke: rgba(255, 105, 180, 0.55);
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .bat .wing {
      transform-box: fill-box;
      animation: flap var(--f, 0.7s) ease-in-out infinite alternate;
    }

    .bat .wing-l { transform-origin: 100% 40%; }
    .bat .wing-r { transform-origin: 0% 40%; }

    @keyframes flap {
      from { transform: scaleY(1); }
      to   { transform: scaleY(0.4); }
    }

    /* ---------- Fixed card with greeting, video and ticket ---------- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;   /* fallback */
      height: 100dvh;  /* mobile Safari 15.4+ / modern browsers */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: calc(env(safe-area-inset-top) + 2dvh) 10px 0;
      box-sizing: border-box;
      pointer-events: none; /* scrolling passes through */
      z-index: 10;
    }

    .card {
      width: min(100%, 520px);
      box-sizing: border-box;
      padding: 14px 12px 14px;
      border-radius: 22px;
      background: rgba(42, 24, 48, 0.68);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 180, 0.5);
      box-shadow: 0 12px 40px rgba(20, 0, 30, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px; /* space between greeting and the panel below */
      animation: fade-in 1.4s ease-out 0.3s both;
    }

    /* Outer h1 = one-time entrance; inner span = endless float + glow */
    .greeting {
      margin: 4px 0 0;
      font-family: "Snell Roundhand", "Brush Script MT", "Lucida Handwriting",
                   Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: clamp(2rem, 9.5vw, 3rem);
      line-height: 1.15;
      text-align: center;
      color: var(--pink);
      letter-spacing: 0.02em;
      animation: enter-greeting 2s ease-out both;
    }

    .greeting span {
      display: inline-block;
      animation: float 9s ease-in-out infinite, glow 6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes enter-greeting {
      from { opacity: 0; transform: translateY(-40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    @keyframes glow {
      0%, 100% {
        text-shadow: 0 2px 4px rgba(20, 0, 20, 0.8),
                     0 0 10px rgba(255, 105, 180, 0.35),
                     0 0 22px rgba(255, 105, 180, 0.2);
      }
      50% {
        text-shadow: 0 2px 4px rgba(20, 0, 20, 0.8),
                     0 0 14px rgba(255, 170, 215, 0.85),
                     0 0 34px rgba(255, 105, 180, 0.6);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Hide / show panel (no JavaScript needed) */
    .more {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px; /* space between video and ticket */
    }

    .more summary {
      align-self: center;
      list-style: none;
      cursor: pointer;
      padding: 8px 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: var(--cream);
      font: 600 0.95rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .more summary::-webkit-details-marker { display: none; }
    .more[open] .when-closed { display: none; }
    .more:not([open]) .when-open { display: none; }

    /* While closed: slow, gentle glow on the button to invite a tap */
    .more:not([open]) summary {
      animation: invite 4s ease-in-out infinite;
    }

    /* When open: smaller, quieter button */
    .more[open] summary {
      padding: 4px 14px;
      font-size: 0.75rem;
    }

    @keyframes invite {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0); }
      50%      { box-shadow: 0 0 16px 3px rgba(255, 105, 180, 0.55); }
    }

    .player {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 30vh;
      max-height: 30dvh;
      background: #000;
      border-radius: 12px;
      border: 2px solid var(--pink);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      pointer-events: auto; /* controls stay usable */
      animation: fade-in 1.6s ease-out both;
    }

    /* Ticket-style link: place + dates on the left, countdown on the right */
    .ticket {
      display: flex;
      align-items: stretch;
      width: 100%;
      box-sizing: border-box;
      border-radius: 14px;
      overflow: hidden;
      background: var(--cream);
      color: #4a0d35;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      animation: fade-in 2.4s ease-out 0.4s both;
    }

    .ticket:active { transform: scale(0.98); }

    .t-main {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .t-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d63384;
    }

    .place { font-weight: 700; font-size: 1rem; line-height: 1.25; }
    .dates { font-size: 0.82rem; opacity: 0.85; }

    .t-count {
      min-width: 78px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-left: 2px dashed rgba(90, 18, 64, 0.35);
      background: linear-gradient(160deg, #ff9ccf, var(--pink));
      color: #4a0d35;
    }

    .t-count b { font-size: 1.7rem; line-height: 1.1; }
    .t-count small { font-size: 0.7rem; font-weight: 600; }

    /* ---------- Larger screens (tablet and up) ---------- */
    @media (min-width: 600px) {
      .overlay { padding-top: calc(env(safe-area-inset-top) + 3dvh); }
      .card { padding: 18px 20px 20px; gap: 14px; }
      .greeting { font-size: clamp(3rem, 6vw, 4rem); }
      .player { max-height: 38dvh; }
      .bat { width: calc(var(--w, 54px) * 1.3); }
    }

    @media (prefers-reduced-motion: reduce) {
      .confetti, .bats { display: none; }
      .card, .greeting, .greeting span, .player, .ticket,
      .more:not([open]) summary { animation: none; }
    }
  </style>
</head>
<body>

  <img class="comic" src="comic.jpg" alt="Birthday comic">

  <!-- Bats (decoration only). Each bat is a small SVG with two flapping wings. -->
  <div class="bats" aria-hidden="true">

    <div class="bat" style="--y:12%; --w:56px; --d:26s; --delay:-6s; --f:0.7s;">
      <div class="bob" style="--bobd:3.4s">
        <svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg>
      </div>
    </div>

    <div class="bat rev" style="--y:30%; --w:42px; --d:32s; --delay:-18s; --f:0.6s;">
      <div class="bob" style="--bobd:2.9s">
        <svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg>
      </div>
    </div>

    <div class="bat" style="--y:50%; --w:64px; --d:30s; --delay:-24s; --f:0.8s;">
      <div class="bob" style="--bobd:3.8s">
        <svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg>
      </div>
    </div>

    <div class="bat rev" style="--y:68%; --w:48px; --d:28s; --delay:-11s; --f:0.65s;">
      <div class="bob" style="--bobd:3.1s">
        <svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg>
      </div>
    </div>

    <div class="bat" style="--y:84%; --w:38px; --d:34s; --delay:-2s; --f:0.55s;">
      <div class="bob" style="--bobd:2.7s">
        <svg viewBox="0 0 100 50"><path class="body wing wing-l" d="M45 22 C35 10 15 8 2 14 C10 16 12 22 18 26 C22 22 26 24 30 30 C34 26 40 28 45 30 Z"/><path class="body wing wing-r" d="M55 22 C65 10 85 8 98 14 C90 16 88 22 82 26 C78 22 74 24 70 30 C66 26 60 28 55 30 Z"/><path class="body" d="M46 20 L47 12 L50 18 L53 12 L54 20 Z"/><ellipse class="body" cx="50" cy="27" rx="5" ry="9"/></svg>
      </div>
    </div>

  </div>

  <div class="confetti" aria-hidden="true">
    <i style="--x:4%;  --c:#ff69b4; --d:13s; --delay:-2s;  --s:8px;  --drift:30px"></i>
    <i style="--x:10%; --c:#ffd27a; --d:16s; --delay:-9s;  --s:7px;  --drift:-25px"></i>
    <i style="--x:17%; --c:#fff3d1; --d:12s; --delay:-5s;  --s:6px;  --drift:20px"></i>
    <i style="--x:25%; --c:#b388ff; --d:15s; --delay:-12s; --s:8px;  --drift:-30px"></i>
    <i style="--x:33%; --c:#7fe0d0; --d:14s; --delay:-1s;  --s:7px;  --drift:25px"></i>
    <i style="--x:41%; --c:#ff69b4; --d:17s; --delay:-7s;  --s:9px;  --drift:-20px"></i>
    <i style="--x:49%; --c:#ffd27a; --d:13s; --delay:-14s; --s:6px;  --drift:30px"></i>
    <i style="--x:57%; --c:#fff3d1; --d:16s; --delay:-3s;  --s:8px;  --drift:-25px"></i>
    <i style="--x:64%; --c:#b388ff; --d:12s; --delay:-10s; --s:7px;  --drift:20px"></i>
    <i style="--x:72%; --c:#7fe0d0; --d:15s; --delay:-6s;  --s:8px;  --drift:-30px"></i>
    <i style="--x:79%; --c:#ff69b4; --d:14s; --delay:-13s; --s:6px;  --drift:25px"></i>
    <i style="--x:86%; --c:#ffd27a; --d:17s; --delay:-4s;  --s:9px;  --drift:-20px"></i>
    <i style="--x:92%; --c:#fff3d1; --d:13s; --delay:-11s; --s:7px;  --drift:30px"></i>
    <i style="--x:97%; --c:#b388ff; --d:16s; --delay:-8s;  --s:8px;  --drift:-25px"></i>
  </div>

  <div class="overlay">
    <main class="card">
      <h1 class="greeting"><span>Happy Birthday,<br>Szczureczka!</span></h1>

      <!-- No "open" attribute, so the panel starts closed -->
      <details class="more">
        <summary>
          <span class="when-closed">🎁 Open your surprise</span>
          <span class="when-open">Close ▲</span>
        </summary>

        <video class="player" src="video.mp4#t=0.1" controls playsinline preload="metadata"></video>

        <a class="ticket" href="https://winosabat.pl/pokoje-goscinne/" target="_blank" rel="noopener noreferrer">
          <span class="t-main">
            <span class="t-label">Your getaway</span>
            <span class="place">Winnica i Winiarnia Celtica</span>
            <span class="dates">Mon 16 – Wed 18 November 2026</span>
          </span>
          <span class="t-count">
            <b id="days">🎉</b>
            <small id="unit">soon</small>
          </span>
        </a>
      </details>
    </main>
  </div>

  <script>
    /* Countdown to Monday 16 November 2026 (checked in the visitor's own time zone) */
    (function () {
      try {
        var start = new Date(2026, 10, 16);
        var end = new Date(2026, 10, 19); /* the morning after the stay ends */
        var now = new Date();
        var d = document.getElementById("days");
        var u = document.getElementById("unit");
        if (now < start) {
          var n = Math.ceil((start - now) / 86400000);
          d.textContent = n;
          u.textContent = n === 1 ? "day to go" : "days to go";
        } else if (now < end) {
          d.textContent = "🎉";
          u.textContent = "enjoy!";
        } else {
          d.textContent = "💖";
          u.textContent = "memories";
        }
      } catch (e) {}
    })();
  </script>

</body>
</html>
